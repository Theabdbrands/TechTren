name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps  # ← Add flag here

      - name: Build project
        run: npm run build

      - name: Clean workspace for deployment
        run: |
          rm -rf node_modules        # EB will install these itself
          rm -rf src                 # Not needed for server
          rm -rf .github
          rm -rf .vscode
          rm -rf .pnpm-store         # If pnpm created this
          rm -rf .pnpm               # Remove leftover pnpm folders

      - name: Remove old pnpm EB configs
        run: |
          rm -rf .ebextensions/00_install_pnpm.config
          rm -rf .ebextensions/01_pnpm.config

      - name: Create deployment package
        run: zip -r app.zip . -x '*.git*' '*.github*' '.vscode/*'

      - name: Deploy to AWS Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
           aws_access_key: ${{ }}
          aws_secret_key: ${{ }}
            application_name: ""
          environment_name: ""
          region: "us-east-1"
          version_label: "build-${{ github.run_number }}"
          deployment_package: "app.zip"
          wait_for_deployment: true